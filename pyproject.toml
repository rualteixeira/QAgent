[project]
name = "qagent"
version = "0.1.0"
description = "QAgent — execução autónoma de testes mobile nativos via appium-mcp"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Versões fixas: esta combinação foi validada em conjunto.
    "langchain-core==0.3.46",
    "langchain-openai==0.3.1",
    "langchain-google-genai==2.1.0",
    "langgraph>=0.5,<0.6",
    # 0.2.0 declara langchain-core>=0.3.36 mas importa langchain_core.messages.content
    # (inexistente no 0.3.46) → ModuleNotFoundError. 0.1.14 é o último compatível.
    "langchain-mcp-adapters==0.1.14",
    # Sem teto, o resolver pode escolher mcp 2.x (major nova, não validada).
    "mcp>=1.30,<2",
    # O mcp >= 1.13 exige pydantic >= 2.11 (com 2.10 o resolver desce o mcp para 1.12.4,
    # que não tem streamable_http_client).
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    # API
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "appium-python-client>=4,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# FastAPI 0.115 + pydantic >= 2.12: avisos inofensivos sobre aliases em Field() dos modelos de corpo.
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
    # langchain-core 0.3.46 + pydantic 2.14: avisos de depreciação inofensivos.
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qagent"]
